<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>{{if eq .TabTitleFormat "host-only"}}{{.Host}}{{else if eq .TabTitleFormat "session-only"}}{{.Session}}{{else if eq .TabTitleFormat "session-host"}}{{.Session}} / {{.Host}}{{else}}{{.Host}} / {{.Session}}{{end}}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4 17 10 11 4 5'/%3E%3Cline x1='12' y1='19' x2='20' y2='19'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/vendor/xterm.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #1a1a2e; overflow: hidden; }

        /* Scrollbars — same slim, low-contrast treatment as the dashboard,
           but the colors are derived from the active terminal theme in
           applyTheme() so they re-tint whenever the theme changes. The
           values here are the "Default" theme's, used until JS runs. */
        :root {
            color-scheme: dark;
            --sb-thumb: #4c4c66;
            --sb-thumb-hover: #6a6a85;
        }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb {
            background: var(--sb-thumb);
            border-radius: 10px;
            /* Transparent border + padding-box clip insets the thumb without
               having to paint a track color that matches the backdrop. */
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        *::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); background-clip: padding-box; }
        *::-webkit-scrollbar-corner { background: transparent; }
        /* The toolbar dropdowns keep their own dark chrome whatever the
           terminal theme is, so their scrollbar stays dark too. */
        .toolbar-dropdown { --sb-thumb: #3f3f5f; --sb-thumb-hover: #56567d; }
        /* Firefox (and anything without the -webkit- pseudo-elements). Chrome
           ignores ::-webkit-scrollbar on any element that also sets these, so
           they must NOT apply where the rules above do. */
        @supports not selector(::-webkit-scrollbar) {
            * { scrollbar-width: thin; scrollbar-color: var(--sb-thumb) transparent; }
        }

        body {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: #16213e;
            color: #a0a0b0;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
        }
        #toolbar a { color: #7c83ff; text-decoration: none; }
        #toolbar a:hover { text-decoration: underline; }
        #toolbar .info { display: flex; gap: 16px; align-items: center; }
        #toolbar .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; }
        #toolbar .status.connected { background: #4ade80; }
        #toolbar .status.disconnected { background: #f87171; }
        .btn-small {
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-small:hover { background: #3a3a5a; }

        /* Icon-only toolbar buttons — theme, handoff, menu. Square so the
           three read as one group regardless of glyph width. */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px; height: 24px;
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            touch-action: manipulation;
        }
        .btn-icon:hover { background: #3a3a5a; color: #fff; }
        .btn-icon svg { display: block; }
        .btn-icon.ok { color: #4ade80; border-color: #4ade80; }
        /* Tooltips for the icon-only toolbar buttons. Below and right-aligned:
           the toolbar is at the very top of the window and these sit at its
           right edge, so there is no room above and none to the right. */
        .btn-icon[data-tip] { position: relative; }
        .btn-icon[data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            top: 100%; right: 0;
            margin-top: 6px;
            background: #1e1e38;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 12px;
            line-height: 1.4;
            color: #e0e0e8;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms ease 250ms;
            z-index: 1002;
        }
        .btn-icon[data-tip]:hover::after,
        .btn-icon[data-tip]:focus-visible::after { opacity: 1; }
        /* The theme picker and the theme-name flash occupy this exact spot —
           don't stack a tooltip on top of either. */
        .btn-icon[data-tip][aria-expanded="true"]::after { opacity: 0; transition: none; }
        div:has(> #theme-flash.show) > .btn-icon[data-tip]::after { opacity: 0; transition: none; }
        @media (prefers-reduced-motion: reduce) { .btn-icon[data-tip]::after { transition: none; } }

        /* Font-size row inside the menu, laid out like a browser's zoom
           control: label on the left, − [value] + on the right. */
        .menu-zoom {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px;
            padding: 8px 12px 8px 14px;
        }
        .menu-zoom-label { font-size: 13px; color: #e0e0e8; white-space: nowrap; }
        .menu-zoom-ctl { display: inline-flex; align-items: center; gap: 2px; }
        .menu-zoom-ctl button {
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            padding: 4px 0;
            width: 26px;
            text-align: center;
            font-family: inherit;
            touch-action: manipulation;
        }
        .menu-zoom-ctl button:hover { background: #3a3a5a; color: #fff; }
        /* Reset button is wider — it holds the current size. */
        .menu-zoom-ctl button#zoom-reset-btn {
            width: 34px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
        }

        /* Host badge — only visible on wide screens */
        .host-badge {
            display: none;
            font-style: italic;
            color: #6a6a8a;
            font-size: 12px;
            margin-left: 6px;
        }
        .host-badge::before { content: "["; }
        .host-badge::after  { content: "]"; }
        @media (min-width: 700px) {
            .host-badge { display: inline; }
        }

        /* Narrow/mobile: compact toolbar */
        @media (max-width: 600px) {
            .dash-text { display: none; }
            .dash-icon { display: inline; }
            #toolbar { padding: 4px 8px; }
            #toolbar .info { gap: 8px; }
        }
        @media (min-width: 601px) {
            .dash-icon { display: none; }
        }
        .toolbar-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #1e1e38;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            z-index: 1000;
            min-width: 130px;
            overflow: hidden;
        }
        .toolbar-menu-item {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            color: #e0e0e8;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        .toolbar-menu-item:active { background: #3a3a5a; }
        /* Kill sits two rows below Send Ctrl-C in a menu you open with one
           click; colouring it stops it reading as one more ordinary action. */
        .toolbar-menu-item.danger { color: #ff8a8a; }
        .toolbar-menu-divider { height: 1px; background: #3a3a5a; margin: 4px 0; }

        /* Theme picker */
        .theme-dropdown {
            /* Right-aligned like the burger menu. Left-anchoring it (the old
               behaviour) hung the panel off the right edge of the window now
               that Theme sits in the top-right cluster. */
            right: 0; left: auto;
            max-height: 360px;
            overflow-y: auto;
            min-width: 200px;
            padding: 4px 0;
        }
        /* Transient theme name shown when cycling with the middle button. */
        .theme-flash {
            position: absolute;
            right: 0; top: 100%;
            margin-top: 4px;
            background: #1e1e38;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            color: #e0e0e8;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 160ms;
            z-index: 1001;
        }
        .theme-flash.show { opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            .theme-flash { transition: none; }
        }
        .theme-option {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 12px;
            background: none;
            border: none;
            color: #e0e0e8;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
        }
        .theme-option:hover { background: #3a3a5a; }
        .theme-option.active { background: #2a2a5a; }
        .theme-option.active .theme-name { font-weight: 600; }
        .theme-swatches {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .theme-swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #terminal { flex: 1; min-height: 0; overflow: hidden; }
        /* xterm.js's local viewport scrollbar is the real scrollback now —
           the relay strips tmux's mouse/alt-screen escapes and prefills
           history via capture-pane, so xterm drives smooth scroll locally. */

        /* On touch devices, make the canvas (.xterm-screen) transparent
           to pointer events so finger drags fall straight through to the
           sibling .xterm-viewport, which the browser then scrolls
           natively (momentum, kinetic, the lot). Selection-by-touch
           stops working on the canvas as a result — for a remote-tmux
           viewer that's an acceptable trade.

           .xterm-helpers (which contains the input textarea) is a
           SIBLING of .xterm-screen, not a child, so input still works. */
        @media (pointer: coarse) {
            .xterm .xterm-screen { pointer-events: none; }
            .xterm .xterm-viewport { -webkit-overflow-scrolling: touch; }
        }

        /* Mobile keyboard toolbar — only shown on touch devices */
        #mobile-bar {
            display: none;
            background: #16213e;
            border-top: 1px solid #2a2a4a;
            padding: 6px 8px;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        @media (pointer: coarse) {
            #mobile-bar { display: flex; }
        }
        #mobile-input {
            flex: 1;
            min-width: 80px;
            background: #2a2a4a;
            color: #ddd;
            border: 1px solid #3a3a5a;
            border-radius: 4px;
            padding: 4px 8px;
            font-family: 'SF Mono', monospace;
            font-size: 13px;
            outline: none;
        }
        #mobile-input::placeholder { color: #666; }
        #mobile-input:focus { border-color: #7c83ff; }
        #mobile-bar button {
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            touch-action: manipulation;
        }
        #mobile-bar button:active { background: #3a3a5a; }

    </style>
</head>
<body>
    <div id="toolbar">
        <div class="info">
            <a href="/"><span class="dash-icon">&#9664;</span><span class="dash-text">← dashboard</span></a>
            <span id="session-label">{{if eq .TabTitleFormat "host-only"}}{{.Host}}{{else if eq .TabTitleFormat "session-only"}}{{.Session}}{{else if eq .TabTitleFormat "session-host"}}{{.Session}} / {{.Host}}{{else}}{{.Host}} / {{.Session}}{{end}}</span><span class="host-badge" id="host-badge">{{.Host}}</span>
            <span class="status" id="ws-status"></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
            <div style="position:relative;">
                <!-- Swatch grid doubles as a preview: applyTheme() paints these
                     four squares with muted colours from the active theme. -->
                <button class="btn-icon" id="theme-btn" data-tip="Change the terminal theme — middle-click to cycle" aria-label="Terminal theme" aria-expanded="false">
                    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                        <rect id="sw-1" x="1.5" y="1.5" width="5.6" height="5.6" rx="1.4"/>
                        <rect id="sw-2" x="8.9" y="1.5" width="5.6" height="5.6" rx="1.4"/>
                        <rect id="sw-3" x="1.5" y="8.9" width="5.6" height="5.6" rx="1.4"/>
                        <rect id="sw-4" x="8.9" y="8.9" width="5.6" height="5.6" rx="1.4"/>
                    </svg>
                </button>
                <div id="theme-dropdown" class="toolbar-dropdown theme-dropdown" style="display:none;"></div>
                <!-- Names the theme you just cycled onto. 24 themes is too
                     many to step through blind. -->
                <div id="theme-flash" class="theme-flash" aria-live="polite"></div>
            </div>
            <button class="btn-icon" id="handoff-btn" data-tip="Copy the SSH command to attach from your own terminal" aria-label="Copy SSH command">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <polyline points="6 9 9 12 6 15"/>
                    <line x1="12" y1="15" x2="17" y2="15"/>
                </svg>
            </button>
            <div style="position:relative;">
                <button class="btn-icon" id="toolbar-burger" title="More actions" aria-label="More actions" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div id="toolbar-menu" class="toolbar-dropdown" style="display:none;">
                    <div class="menu-zoom">
                        <span class="menu-zoom-label">Font size</span>
                        <div class="menu-zoom-ctl">
                            <button type="button" id="zoom-out-btn" title="Smaller">&#8722;</button>
                            <button type="button" id="zoom-reset-btn" title="Reset"><span id="zoom-level">14</span></button>
                            <button type="button" id="zoom-in-btn" title="Larger">+</button>
                        </div>
                    </div>
                    <div class="toolbar-menu-divider"></div>
                    <button class="toolbar-menu-item" id="paste-btn">Paste</button>
                    <button class="toolbar-menu-item" id="rename-btn">Rename</button>
                    <button class="toolbar-menu-item" id="duplicate-btn">Duplicate</button>
                    <button class="toolbar-menu-item" id="detach-btn">Kick Other Clients</button>
                    <div class="toolbar-menu-divider"></div>
                    <button class="toolbar-menu-item" id="offload-btn">Offload</button>
                    <button class="toolbar-menu-item danger" id="kill-btn">Kill Session</button>
                    <div class="toolbar-menu-divider"></div>
                    <button class="toolbar-menu-item" id="ctrl-c-btn">Send Ctrl-C</button>
                    <button class="toolbar-menu-item" id="ctrl-d-btn">Send Ctrl-D</button>
                    <button class="toolbar-menu-item" id="ctrl-w-btn">Send Ctrl-W</button>
                </div>
            </div>
        </div>
    </div>
    <div id="terminal" style="position:relative;"></div>
    <div id="mobile-bar">
        <input id="mobile-input" type="text" inputmode="text"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="type here →">
        <button data-key="Tab">Tab</button>
        <button data-key="Escape">Esc</button>
        <button data-key="ArrowUp">↑</button>
        <button data-key="ArrowDown">↓</button>
        <button data-key="ArrowLeft">←</button>
        <button data-key="ArrowRight">→</button>
        <button data-mod="ctrl">Ctrl</button>
        <button data-key="/">/</button>
        <button data-key="|">|</button>
        <button data-key="~">~</button>
    </div>

    <script src="/static/vendor/xterm.min.js"></script>
    <script src="/static/vendor/xterm-addon-fit.min.js"></script>
    <script src="/static/vendor/xterm-addon-web-links.min.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/terminal.js"></script>
    <script>
        window._tabTitleFormat = "{{.TabTitleFormat}}";
        window._scrollbackLines = {{.ScrollbackLines}};
        initTerminal("{{.Host}}", "{{.Session}}");

        // Update favicon to match session/host icon
        (function() {
            var host = "{{.Host}}";
            var session = "{{.Session}}";

            function setFavicon(iconName, colorName) {
                if (!iconName || !window.APP_ICONS) return;
                var icon = window.APP_ICONS.find(function(i) { return i.name === iconName; });
                if (!icon) return;
                var hex = window.colorHex ? window.colorHex(colorName || "default") : "#3b82f6";
                var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + hex + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon.svg + '</svg>';
                var encoded = 'data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27');
                var link = document.querySelector('link[rel="icon"]');
                if (link) link.href = encoded;
            }

            // Load session icons from server, then set favicon
            window.loadSessionIcons(function() {
                var sessionIcon = window.getSessionIcon ? window.getSessionIcon(host, session) : null;
                var sessionColor = window.getSessionIconColor ? window.getSessionIconColor(host, session) : null;
                if (sessionIcon) {
                    setFavicon(sessionIcon, sessionColor);
                } else {
                    // Fall back to host icon
                    fetch('/api/hosts').then(function(r) { return r.json(); }).then(function(hosts) {
                        var h = hosts.find(function(x) { return x.config.name === host; });
                        if (h && (h.config.icon || h.config.icon_color)) {
                            setFavicon(h.config.icon || "terminal", h.config.icon_color || "default");
                        }
                    }).catch(function() {});
                }
            });

            // Update tab title based on settings
            fetch('/api/settings').then(function(r) { return r.json(); }).then(function(s) {
                window._tabTitleFormat = s.tab_title_format || "host-session";
                var title = window.formatTabTitle(host, session);
                document.title = title;
                document.getElementById("session-label").textContent = title;
            }).catch(function() {});
        })();
    </script>
</body>
</html>
